<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>KontactForm</title>
</head>
<body class="bg-light">


    <div class="container py-5">
        <div class="card p-4 shadow">
            <h1>Kontaktform</h1>
            <form id="contactForm">
                <div class="mb-3">
                    <input class="form-control" id="name" placeholder="Name" required>
                </div>
                <div class="mb-3">
                    <input class="form-control" id="email" type="email" placeholder="Email" required>
                </div>
                <div class="mb-3">
                    <textarea class="form-control" id="message" placeholder="Message" required></textarea>
                </div>
                <button class="btn btn-primary" type="submit">Skicka</button>
            </form>
            <div class="mt-3" id="status"></div>
        </div>
    </div> 
    <div class="card p-4 shadow">
        <h3 class="mt-5">Alla meddelanden</h3>
        <button id="loadMessages" class="btn btn-secondary mb-3">Ladda meddelanden</button>

        <ul id="messageList" class="list-group"></ul>
    </div>    

    <script src="app.js"></script>
</body>
</html>
